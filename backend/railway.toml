[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt"

[deploy]
startCommand = "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
watchPatterns = ["app/**", "requirements.txt"]
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3

[environment]
ENVIRONMENT = "production"
API_PREFIX = "/api/v1"
CORS_ORIGINS = '["https://learnx.vercel.app","https://learnx.pages.dev"]'
# DATABASE_URL must be set in Railway project variables (Supabase PostgreSQL)
# REDIS_URL must be set in Railway project variables
